name: CI - Biblioteca Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # El proyecto usa Mongoose 9 / MongoDB Driver 7, que requieren Node >= 20.19
        node-version: [20.x]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/biblioteca_test
      JWT_SECRET: ci_jwt_secret_do_not_use_in_production
      JWT_EXPIRES_IN: 1d
      LOAN_PERIOD_DAYS: 14

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias y de integración (Jest)
        run: npm test

      - name: Ejecutar pruebas funcionales con Newman
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for intento in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/api/books > /dev/null; then
              echo "Servidor disponible en http://localhost:5000"
              break
            fi
            echo "Esperando al servidor... (intento $intento/30)"
            sleep 2
          done

          if ! curl --fail --silent http://localhost:5000/api/books > /dev/null; then
            echo "El servidor no respondió a tiempo"
            cat server.log
            exit 1
          fi

          npm run test:newman -- \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml

      - name: Mostrar log del servidor si falla la ejecución
        if: failure()
        run: cat server.log

      - name: Publicar reporte de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.xml
          if-no-files-found: ignore

      - name: Publicar log del servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore
